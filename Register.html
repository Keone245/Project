    <main class="card">

      
      <nav class="main-nav">
        <ul>
        <a href="index.html">Log</a>
        <a href="history.html">History</a>
        <a href="current.html">Current</a>
        <a href="players&coaches.html">Players and Coaches</a>

        <a href="leaderboard.html" id="nav-leaderboard">Leaderboard</a>
        <a href="aboutme.html">about me</a>
        </ul>
      </nav>

      
      <form id="fanForm">
        <label>Favorite Player</label>
        <select id="player">
          <option>Vinícius Jr</option>
          <option>Bellingham</option>
          <option>Rodrygo</option>
          <option>Valverde</option>
          <option>Courtois</option>
          <option>Rudiger</option>
          <option>Mbappe</option>
          <option>Tchouameni</option>
          <option>Courtois</option>
          <option>Brahim</option>
          <option>Camavinga</option>
          <option>Huijsen</option>
          <option>Carreras</option>
          <option>Carvajal</option>
          <option>Alexander-Arnold</option>
          <option>Lunin</option>
          <option>Ceballos</option>
          <option>Guler</option>
          <option>Mendy</option>
          <option>Garcia</option>

        </select>

        <label>Favorite Manager</label>
        <select id="Manager">
          <option>Arbeloa</option>
          <option>Alonso</option>
          <option>Ancelotti</option>
          <option>Zidane</option>
          <option>Solari</option>
          <option>Lopetegui</option>
          <option>Benitez</option>
          <option>Mourinho</option>
        </select>

        <label>Favorite Competition</label>
        <div class="radio-group">
          <label><input type="radio" name="comp" value="La Liga" required> La Liga</label>
          <label><input type="radio" name="comp" value="UEFA Champions League"> UCL</label>
          <label><input type="radio" name="comp" value="Copa Del Rey"> Copa Del Rey</label>
          <label><input type="radio" name="comp" value="Copa De Espana"> Copa De Espana</label>
          <label><input type="radio" name="comp" value="Fifa Club World Cup"> CWC</label>
        </div>

        <label>Fan Since (Year)</label> 
        <input type="number" id="since" required>

        <button type="submit">Register</button>
      </form>

      <button class="logout" onclick="logout()">Logout</button>

    </main>
  </div>

  <script src="script.js"></script>

</html>
