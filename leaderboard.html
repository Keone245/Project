 if (Array.isArray(fans)) {
    fans.sort((a, b) => a.since - b.since);
    const list = document.getElementById("list");

    fans.forEach(f => {
      const li = document.createElement("li");
      li.textContent = `${f.name} — Fan since ${f.since}`;
